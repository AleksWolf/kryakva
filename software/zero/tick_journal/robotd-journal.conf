# /etc/systemd/system/robotd.service.d/journal.conf: robotd always writes the tick journal to RAM (/tmp/duck),
# duck-tickflush moves it to SD.
[Service]
ReadWritePaths=/tmp/duck
ExecStart=
ExecStart=/home/duck/duck-bench/bin/robotd --params /home/duck/duck-bench/robotd.toml --socket /run/duck/robot.sock --vetbook /run/duck/vetbook.json --relax-at-start --pad-lost-relax 2 --leg-load --journal /tmp/duck/walk.jsonl
