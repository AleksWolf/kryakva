<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duck</title>
<style>
:root{--bg:#0b0612;--p:#140b21;--p2:#1c1030;--bar:#3b1f63;--line:#2e1a4b;--green:#a4ff2e;--green2:#62a81c;--orange:#ff8c1a;--red:#ff2b2b;
  --text:#f1ecfa;--muted:#9a8cb5;--mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.35}
.top{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:minmax(0,1fr) 260px;background:var(--p);border-bottom:2px solid var(--green2)}
.sum{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));min-width:0}
.cell{padding:8px 12px;border-right:1px solid var(--line);min-width:0}
.cell .k{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.cell .v{font-size:26px;font-weight:700;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v small{font-size:14px;color:var(--text);font-weight:400}
.cell .s{font-size:12px;color:var(--muted)}
.batbar{height:6px;background:#2a1844;margin-top:4px}.batbar i{display:block;height:100%;width:0;background:var(--green)}
.states{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.states b{font-size:11px;padding:1px 4px;border:1px solid var(--line);color:var(--muted);font-weight:400}
.states b.cur{background:var(--green);color:#0b0612;border-color:var(--green);font-weight:700}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}.dim{color:var(--muted)}
.kill{appearance:none;border:0;cursor:pointer;color:#fff;font:700 28px var(--mono);letter-spacing:.06em;width:100%;height:100%;min-height:76px;
  background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#d81818 14px 28px);touch-action:manipulation;text-shadow:0 2px 0 #600}
.kill small{display:block;font-size:12px;font-weight:400;letter-spacing:.04em;color:#ffe0e0;text-shadow:none}
.kill:active,.kill.press{filter:brightness(.8)}
main{display:grid;gap:8px;padding:8px;grid-template-columns:300px minmax(0,1fr) 300px;align-items:start;max-width:1500px;margin:0 auto}
.panel{background:var(--p);border:1px solid var(--line);min-width:0}
.panel>h3{margin:0;padding:5px 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;background:var(--bar);color:var(--green);display:flex;justify-content:space-between}
.panel>h3 span{color:var(--muted);letter-spacing:.04em}
.body{padding:10px}.stack{display:grid;gap:8px;min-width:0}
.btn{appearance:none;width:100%;min-height:60px;border:1px solid #5a3a8a;background:var(--p2);color:var(--text);font:700 18px var(--mono);cursor:pointer;
  text-align:left;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;touch-action:manipulation}
.btn+.btn{margin-top:8px}.btn kbd{font:700 13px var(--mono);border:1px solid var(--muted);padding:2px 6px;color:var(--muted)}
.btn:hover{border-color:var(--green2)}.btn:active{background:var(--green);color:#0b0612}
.btn.relax{border-color:var(--orange);color:var(--orange)}
.joyw{display:flex;gap:10px;align-items:center;margin-top:10px}
#joy{width:180px;height:180px;flex:none;border-radius:50%;position:relative;touch-action:none;background:radial-gradient(circle,#1c1030 0 55%,#2a1844 56% 100%);border:1px solid #5a3a8a}
#joy::before,#joy::after{content:"";position:absolute;background:var(--line)}#joy::before{left:50%;top:8px;bottom:8px;width:1px}#joy::after{top:50%;left:8px;right:8px;height:1px}
#knob{width:64px;height:64px;border-radius:50%;position:absolute;left:58px;top:58px;background:var(--green2);border:2px solid var(--green);z-index:1}
#knob.on{background:var(--green)}
#joy.lock{opacity:.35;pointer-events:none}
#cmd{font-size:12px;color:var(--muted)}#cmd b{color:var(--green);font-size:16px}
.kv{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px 8px;align-items:baseline}
.kv .h{font-size:11px;color:var(--muted);text-align:right}.kv .h:first-child{text-align:left}
.kv .l{font-size:11px;color:var(--muted)}.kv .n{font-size:18px;text-align:right}
.big{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.big b{font-size:30px;color:var(--green)}
.horizon{height:56px;margin-top:8px;border:1px solid var(--line);position:relative;overflow:hidden;background:#0e0718}
.horizon i{position:absolute;left:-10%;right:-10%;top:50%;height:2px;background:var(--green)}
.horizon b{position:absolute;left:50%;top:50%;width:40px;height:2px;margin-left:-20px;background:var(--orange)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:400;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 6px;text-align:right;border-bottom:1px solid #1d1131;white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td.id{color:var(--muted)}td.ang{font-size:16px;font-weight:700;color:var(--green)}td.ang.bad{color:var(--red)}
tr.sep td{border-bottom:1px solid #5a3a8a}.tq{font-weight:700}
.tof{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;background:#000}
.tof div{aspect-ratio:1;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.scale{display:flex;font-size:11px;color:var(--muted);justify-content:space-between;margin-top:4px}
#cam{width:100%;display:block;background:#06030b;border:1px solid var(--line)}
.tg{appearance:none;border:1px solid var(--muted);background:transparent;color:var(--muted);font:700 11px var(--mono);letter-spacing:.08em;padding:1px 8px;cursor:pointer;touch-action:manipulation}
.tg.on{border-color:var(--green);background:var(--green);color:#0b0612}
.lang{float:right;display:flex;gap:2px;text-transform:none;letter-spacing:0}.lang button{appearance:none;border:1px solid var(--muted);background:transparent;color:var(--muted);font:700 11px var(--mono);padding:0 5px;cursor:pointer}.lang button.on{border-color:var(--green);background:var(--green);color:#0b0612}
.off-note{color:var(--muted);font-size:12px;padding:6px 0}
#v3d{height:260px;position:relative;border:1px solid var(--line);background:#0e0718}#v3d canvas{display:block}
#hud{position:absolute;left:6px;top:4px;font-size:11px;color:var(--muted)}
.log{font-size:12.5px;line-height:1.5;background:#05020a;padding:8px 10px;height:180px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
@media (max-width:1150px){main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.center{grid-column:1/-1;order:-1}
  .sum{grid-template-columns:repeat(3,minmax(0,1fr))}.cell{border-bottom:1px solid var(--line)}}
@media (max-width:700px){body{padding-bottom:96px}.top{grid-template-columns:minmax(0,1fr);position:static}
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}.cell .v{font-size:22px}
  .killwrap{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:rgba(11,6,18,.95);border-top:1px solid var(--red)}
  .kill{min-height:72px;font-size:24px}main{grid-template-columns:minmax(0,1fr);padding:8px 16px}.center{order:0}
  thead{display:none}table,tbody{display:block}
  tr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;padding:4px 0;border-bottom:1px solid #1d1131}
  td{border:0;padding:1px 4px}td.ang{grid-column:3;grid-row:1}
  td.rest{grid-column:1/-1;text-align:left;white-space:normal;color:var(--muted);font-size:12.5px}td.rest b{color:var(--text);font-weight:400}td.d{display:none}}
@media (min-width:701px){td.rest{display:none}}
</style></head><body>
<div class="top">
  <div class="sum">
    <div class="cell"><div class="k" data-t="bat"></div><div class="v" id="bat">—</div><div class="batbar"><i id="batbar"></i></div><div class="s" id="batp"></div></div>
    <div class="cell"><div class="k">CPU</div><div class="v" id="cpu">—</div><div class="s" id="loop"></div></div>
    <div class="cell"><div class="k" data-t="servos"></div><div class="v" id="nsv">—</div><div class="s" id="nsvs"></div></div>
    <div class="cell" style="grid-column:span 2"><div class="k" data-t="policy"></div><div class="states" id="pol"></div><div class="s" id="move"></div></div>
    <div class="cell"><div class="k"><span data-t="pose"></span><span class="lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button></span></div><div class="v" id="pose">—</div><div class="s" id="poses"></div></div>
  </div>
  <div class="killwrap"><button class="kill" id="kill" type="button"><span data-t="kill"></span><small data-t="kill_sub"></small></button></div>
</div>
<main>
  <div class="stack">
    <section class="panel"><h3 data-t="cmds"></h3><div class="body">
      <button class="btn" id="up" type="button" data-t="up"></button>
      <button class="btn relax" id="relax" type="button"><span data-t="relax"></span> <kbd>R</kbd></button>
      <div class="joyw"><div id="joy"><div id="knob"></div></div>
        <div id="cmd"><span data-t="joyhelp"></span><br><br><span id="cmdv"></span></div></div>
    </div></section>
    <section class="panel"><h3>IMU <span id="imuage"></span></h3><div class="body">
      <div class="kv"><span class="h"></span><span class="h">x</span><span class="h">y</span><span class="h">z</span>
        <span class="l" data-t="grav"></span><span class="n" id="g0">—</span><span class="n" id="g1">—</span><span class="n" id="g2">—</span>
        <span class="l" data-t="gyro"></span><span class="n" id="w0">—</span><span class="n" id="w1">—</span><span class="n" id="w2">—</span></div>
      <div class="big"><span data-t="tilt"></span><b id="tilt">—</b></div>
      <div class="s dim" id="pr"></div>
      <div class="horizon"><i id="hz"></i><b></b></div>
    </div></section>
    <section class="panel"><h3 data-t="v3d"></h3><div class="body"><div id="v3d"><div id="hud" data-t="loading"></div></div></div></section>
  </div>
  <div class="stack center">
    <section class="panel"><h3><span data-t="servos"></span> <span id="svh"></span></h3><div class="body" style="padding:4px 8px">
      <table><thead><tr><th>id</th><th data-t="joint"></th><th data-t="angle"></th><th data-t="limit"></th><th data-t="torque"></th><th data-t="volt"></th><th>°C</th></tr></thead><tbody id="servos"></tbody></table>
    </div></section>
    <section class="panel"><h3><span data-t="journal"></span> <span data-t="last30"></span></h3><div class="log" id="log"></div></section>
  </div>
  <div class="stack">
    <section class="panel"><h3><span data-t="camera"></span> <span><span id="cami"></span> <button class="tg" id="tgcam" type="button"></button></span></h3><div class="body"><div class="off-note" id="camoff" data-t="camoff"></div><canvas id="cam" hidden></canvas></div></section>
    <section class="panel"><h3>ToF 8×8 <span><span id="tofi"></span> <button class="tg" id="tgtof" type="button"></button></span></h3><div class="body"><div class="off-note" id="tofoff" data-t="tofoff"></div><div class="tof" id="tof"></div>
      <div class="scale"><span class="bad" data-t="near"></span><span class="warn">■</span><span class="ok">■</span><span data-t="far"></span></div></div></section>
  </div>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
const $=id=>document.getElementById(id);
const DEG=180/Math.PI, f=(x,d=1)=>x==null||isNaN(x)?'—':(+x).toFixed(d);
const RD=[20,21,22,23,24,30,31,32,33,34,10,11,12,13,14];        // joint order of robot.state and robot.health
const ORDER=[20,21,22,23,24,10,11,12,13,14,30,31,32,33,34], SEP=new Set([24,14]);
const POL=['held','homing','fallsafe','standup','walk'];
const joints={}, ranges={}, names={};

// --- control (no libraries, works without 3D) ---
const post=p=>fetch(p,{method:'POST'}).catch(()=>{});
const kill=$('kill'); kill.onpointerdown=()=>post('poweroff');
$('up').onclick=()=>post('standup');
$('relax').onclick=()=>{stopSend();post('relax')};
const VX=0.4, WZ=1.0;   // full stick = command limits of the walking policy training
let jx=0, jy=0, held=false, padOn=false, want={}; const joy=$('joy'), knob=$('knob');
// --- language: English by default, the choice is remembered in this browser ---
const TX={
 en:{bat:'Battery',servos:'Servos',policy:'Policy',pose:'Pose',kill:'POWER OFF',kill_sub:'relax + poweroff · space / Esc',cmds:'Commands',
  up:'Stand up',relax:'Relax — torque off',joyhelp:'up — forward<br>sideways — turn<br>release — stop<br>keys W A S D',stop:'stop',
  grav:'grav. g',gyro:'gyro °/s',tilt:'body tilt',v3d:'3D view',loading:'loading model…',joint:'joint',angle:'angle °',limit:'limit °',
  torque:'torque',volt:'V',journal:'Log',last30:'last 30',camera:'Camera',camoff:'off — turn on with the button, loads the CPU',
  tofoff:'off — turn on with the button',near:'■ near',far:'■ far 2000',ON:'ON',OFF:'OFF',nolink:'NO LINK',
  loop:(hz,m)=>`loop ${hz} Hz · missed ${m}`,allon:'all online',notall:'not all',norobotd:'no link to robotd',command:'command',
  picked:'PICKED UP',fallen:'LYING',standing:'STANDING',limp:'limp',gain:'gain',nohealth:'not in health',nodata:'no robotd data',
  tqon:'ON',tqoff:'off',lim:'lim',svh:'robotd does not report load and current',pr:(p,r)=>`nose down ${p}° · right side down ${r}°`,
  ms:'ms',valid:'valid',padon:'pad connected —<br>joystick off',noframe:'no frame',camnolink:'no link',
  hud:'body tilted by IMU, heading unknown',no3d:'3D not loaded: ',mps:'m/s',turn:'turn',radps:'rad/s',
  L:{pad_on:'pad connected — page joystick off',pad_off:'no pad — page joystick on',robotd_down:'robotd is not running: sudo systemctl start robotd',
   joy:'joystick',stop0:'stop (speed 0)',poweroff:'POWER OFF',cam_on:'camera on',cam_off:'camera off',tof_on:'ToF on',tof_off:'ToF off',
   relax:'relax: ',standup:'stand up: ',robotd_link:'no link to robotd: ',restart:'stream ended, restarting'}},
 ru:{bat:'Батарея',servos:'Сервы',policy:'Политика',pose:'Поза',kill:'ВЫКЛЮЧИТЬ',kill_sub:'relax + poweroff · пробел / Esc',cmds:'Команды',
  up:'Подъём',relax:'Relax — снять момент',joyhelp:'вверх — вперёд<br>в стороны — поворот<br>отпустил — стоп<br>клавиши W A S D',stop:'стоп',
  grav:'грав. g',gyro:'гиро °/с',tilt:'наклон корпуса',v3d:'3D-вид',loading:'загрузка модели…',joint:'сустав',angle:'угол °',limit:'предел °',
  torque:'момент',volt:'В',journal:'Журнал',last30:'последние 30',camera:'Камера',camoff:'выключена — включается кнопкой, грузит процессор',
  tofoff:'выключен — включается кнопкой',near:'■ близко',far:'■ далеко 2000',ON:'ВКЛ',OFF:'ВЫКЛ',nolink:'НЕТ СВЯЗИ',
  loop:(hz,m)=>`цикл ${hz} Гц · пропусков ${m}`,allon:'все на связи',notall:'не все',norobotd:'нет связи с robotd',command:'команда',
  picked:'ПОДНЯТА',fallen:'ЛЕЖИТ',standing:'СТОИТ',limp:'обмякла (limp)',gain:'усиление',nohealth:'нет в health',nodata:'нет данных robotd',
  tqon:'ВКЛ',tqoff:'выкл',lim:'пред',svh:'нагрузку и ток robotd не отдаёт',pr:(p,r)=>`носом вниз ${p}° · на правый бок ${r}°`,
  ms:'мс',valid:'годных',padon:'пульт на связи —<br>джойстик выключен',noframe:'кадра нет',camnolink:'нет связи',
  hud:'корпус наклонён по IMU, курс не известен',no3d:'3D не загружен: ',mps:'м/с',turn:'поворот',radps:'рад/с',
  L:{pad_on:'пульт на связи — джойстик страницы выключен',pad_off:'пульта нет — джойстик страницы включён',robotd_down:'robotd не запущен: sudo systemctl start robotd',
   joy:'джойстик',stop0:'стоп (скорость 0)',poweroff:'ВЫКЛЮЧЕНИЕ',cam_on:'камера включена',cam_off:'камера выключена',tof_on:'ToF включён',tof_off:'ToF выключен',
   relax:'relax: ',standup:'подъём: ',robotd_link:'нет связи с robotd: ',restart:'поток закончился, перезапуск'}}};
let LANG='en'; try{const l=localStorage.getItem('duck_lang');if(TX[l])LANG=l}catch(e){}
const T=k=>TX[LANG][k];
const LG=(k,x)=>(T('L')[k]||k)+(x||'');   // server messages come as a key and a text tail
function applyLang(){document.documentElement.lang=LANG;document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=T(el.dataset.t));
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));if(!held&&!padOn)$('cmdv').textContent=T('stop')}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{localStorage.setItem('duck_lang',LANG)}catch(e){}applyLang()});
applyLang();
function place(x,y){knob.style.left=(58+x*58)+'px';knob.style.top=(58-y*58)+'px'}
function send(){const vx=jy*VX, wz=-jx*WZ; post(`move?vx=${vx.toFixed(3)}&vyaw=${wz.toFixed(3)}`);
  $('cmdv').innerHTML=`vx <b>${vx.toFixed(2)}</b> ${T('mps')}<br>${T('turn')} <b>${wz.toFixed(2)}</b> ${T('radps')}`}
function startSend(){if(padOn)return;knob.classList.add('on')}
function stopSend(){jx=jy=0;place(0,0);knob.classList.remove('on')}
// without the pad the page sends a command every 100 ms, a zero one too, like padd (robotd: 2 s without commands → relax)
setInterval(()=>{if(!padOn)send()},100);
function joyAt(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/58,y=-(e.clientY-r.top-r.height/2)/58;
  const n=Math.hypot(x,y);if(n>1){x/=n;y/=n}jx=x;jy=y;place(x,y)}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);held=true;joyAt(e);startSend()};
joy.onpointermove=e=>{if(held)joyAt(e)};
joy.onpointerup=joy.onpointercancel=joy.onlostpointercapture=()=>{if(held){held=false;stopSend()}};
const keys=new Set(), K={KeyW:1,KeyA:1,KeyS:1,KeyD:1};
function keyCmd(){jy=(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0);jx=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0);
  if(jx||jy){place(jx,jy);startSend()}else stopSend()}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Escape'){e.preventDefault();kill.classList.add('press');post('poweroff');return}
  if(e.code==='KeyR'&&!e.repeat){stopSend();post('relax');return}
  if(K[e.code]&&!e.repeat){keys.add(e.code);keyCmd()}});
addEventListener('keyup',e=>{kill.classList.remove('press');if(keys.delete(e.code))keyCmd()});
addEventListener('blur',()=>{keys.clear();stopSend()});

// --- status ---
const tv={rot:3,mir:false};   // ToF: turned 270° clockwise, as the duck sees
function tofView(mm){let g=[...Array(8)].map((_,r)=>mm.slice(r*8,r*8+8));
  for(let k=0;k<tv.rot;k++)g=g[0].map((_,c)=>g.map(row=>row[c]).reverse());if(tv.mir)g=g.map(r=>[...r].reverse());return g.flat()}
const tofC=mm=>mm<0?'#1a1028':mm<500?'#ff2b2b':mm<900?'#ff8c1a':mm<1400?'#a4ff2e':'#3b1f63';
async function tick(){
  let s; try{s=await (await fetch('state',{cache:'no-store'})).json()}catch(e){$('pose').innerHTML=`<span class="bad">${T('nolink')}</span>`;return setTimeout(tick,1000)}
  const now=s.t, st=s.state||{}, live=s.state&&now-st.rx<2.5, sf=st.safety||{}, h=s.health||{}, B=h.battery;
  const bat=B?B.volts:null;
  $('bat').innerHTML=`<span class="${bat==null?'dim':bat<=6.6?'bad':bat<7.0?'warn':''}">${f(bat,2)}</span><small> ${T('volt')}</small>`;
  $('batbar').style.width=(B?Math.max(0,Math.min(100,B.percent)):0)+'%'; $('batp').textContent=B?f(B.percent,0)+' %':'';
  $('cpu').innerHTML=`<span class="${s.cpu_c>=75?'bad':s.cpu_c>=65?'warn':''}">${f(s.cpu_c,0)}</span><small> °C</small>`;
  $('loop').textContent=st.loop?T('loop')(f(st.loop.hz,1),st.loop.missed):'';
  const hs={}; ((h.feetech&&h.feetech.servos)||[]).forEach(x=>hs[x.id]=x); const n=Object.keys(hs).length;
  $('nsv').innerHTML=`${n}<small>/15</small>`; $('nsvs').innerHTML=n===15?`<span class="ok">${T('allon')}</span>`:`<span class="bad">${T('notall')}</span>`;
  $('pol').innerHTML=live?POL.map(p=>`<b class="${p===st.policy?'cur':''}">${p}</b>`).join('')+(POL.includes(st.policy)?'':`<b class="cur">${st.policy}</b>`):`<span class="bad">${T('norobotd')}</span>`;
  const m=st.move||{}; $('move').textContent=m.requested?`${T('command')} ${m.requested.map(x=>f(x,2)).join(' ')} → ${m.applied.map(x=>f(x,2)).join(' ')} ${(m.limited_by||[]).join(' ')}`:'';
  $('pose').innerHTML=!live?'—':sf.picked_up?`<span class="bad">${T('picked')}</span>`:sf.fallen?`<span class="warn">${T('fallen')}</span>`:`<span class="ok">${T('standing')}</span>`;
  $('poses').textContent=live?(sf.limp?T('limp'):'')+` · ${T('gain')} ${sf.gain}`:'';
  const js=st.joints; let rows='';
  for(const id of ORDER){const x=hs[id];
    if(!x||!js){rows+=`<tr><td class="id">${id}</td><td>${names[id]||''}</td><td class="bad" colspan=5>${js?T('nohealth'):T('nodata')}</td></tr>`;continue}
    const a=js[RD.indexOf(id)], r=ranges[id]; if(joints[id])joints[id].p.quaternion.setFromAxisAngle(joints[id].axis,a);
    const out=r&&(a<r[0]-1e-3||a>r[1]+1e-3), lim=r?f(r[0]*DEG,0)+'…'+f(r[1]*DEG,0):'—';
    const tq=x.torque?`<span class="tq ok">${T('tqon')}</span>`:`<span class="tq warn">${T('tqoff')}</span>`;
    const t=x.temp_c>=60?`<span class="bad">${x.temp_c}</span>`:x.temp_c>=50?`<span class="warn">${x.temp_c}</span>`:x.temp_c;
    rows+=`<tr class="${SEP.has(id)?'sep':''}"><td class="id">${id}</td><td>${names[id]||x.joint}</td><td class="ang ${out?'bad':''}">${f(a*DEG)}</td>`+
      `<td class="d">${lim}</td><td class="d">${tq}</td><td class="d">${f(x.volts)}</td><td class="d">${t}</td>`+
      `<td class="rest">${T('lim')} <b>${lim}</b> · ${tq} · <b>${f(x.volts)}</b> ${T('volt')} · ${t} °C</td></tr>`}
  $('servos').innerHTML=rows; $('svh').textContent=`${n}/15 · ${T('svh')}`;
  const g=live&&sf.gravity, w=live&&st.imu&&st.imu.gyro;
  if(g){const nn=Math.hypot(...g)||1, tilt=Math.acos(Math.max(-1,Math.min(1,-g[2]/nn)))*DEG, pitch=Math.atan2(g[0],-g[2])*DEG, roll=Math.atan2(-g[1],-g[2])*DEG;
    [0,1,2].forEach(i=>{$('g'+i).textContent=f(g[i],2);$('w'+i).textContent=w?f(w[i]*DEG,1):'—'});
    $('tilt').innerHTML=`<span class="${tilt>35?'bad':tilt>10?'warn':''}">${f(tilt)}°</span>`; $('pr').textContent=T('pr')(f(pitch),f(roll));
    $('hz').style.transform=`translateY(${Math.max(-26,Math.min(26,pitch*0.6))}px) rotate(${-roll}deg)`;
    $('imuage').textContent=f((now-st.rx)*1000,0)+' '+T('ms'); if(window.tiltTrunk)window.tiltTrunk(g)}
  else $('tilt').textContent='—';
  want=s.want||{};
  for(const k of ['cam','tof']){const b=$('tg'+k),on=!!want[k];b.classList.toggle('on',on);b.textContent=on?T('ON'):T('OFF');$(k+'off').hidden=on}
  $('cam').hidden=!want.cam; if(!want.tof){$('tof').innerHTML='';$('tofi').textContent=''} if(!want.cam)$('cami').textContent='';
  const tf=s.tof; if(want.tof&&tf){$('tof').innerHTML=tofView(tf.mm).map(mm=>`<div style="background:${tofC(mm)};color:${mm>=0&&mm<1400?'#0b0612':'#f1ecfa'}">${mm<0?'–':mm}</div>`).join('');
    $('tofi').textContent=`${T('valid')} ${tf.mm.filter(x=>x>=0).length}/64 · ${f((now-tf.t)*1000,0)} ${T('ms')}`}
  padOn=!!s.pad; joy.classList.toggle('lock',padOn);
  if(padOn){stopSend();$('cmdv').innerHTML=`<span class="warn">${T('padon')}</span>`}
  const er=Object.entries(s.errors||{}).map(([k,e])=>`<span class="bad">${k}: ${LG(e[0],e[1])}</span>`);
  $('log').innerHTML=er.concat((s.log||[]).slice().reverse().map(e=>e[0]+' '+LG(e[1],e[2]))).join('\n');
  setTimeout(tick,1000)}   // status once a second (CPU load); the joystick has its own 100 ms loop
tick();

// --- camera and ToF switches (off by default: they heat the board) ---
for(const k of ['cam','tof'])$('tg'+k).onclick=()=>{want[k]=!want[k];post(`toggle?what=${k}&on=${want[k]?1:0}`)};

// --- camera ---
const cv=$('cam'), cx=cv.getContext('2d'); cv.width=480; cv.height=640;
const off=document.createElement('canvas'); off.width=640; off.height=480; const ox=off.getContext('2d'), img=ox.createImageData(640,480);
const cvw={rot:1,mir:false};   // camera: turned 90° clockwise, as the duck sees
async function camTick(){
  if(!want.cam)return setTimeout(camTick,300);
  try{const b=new Uint8Array(await (await fetch('cam.nv12',{cache:'no-store'})).arrayBuffer());
    if(b.length===640*480*3/2){const W=640,H=480,d=img.data,uv=W*H;
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){const Y=b[y*W+x]-16,i=uv+(y>>1)*W+(x&~1),U=b[i]-128,V=b[i+1]-128,o=(y*W+x)*4,c=1.164*Y;
        d[o]=c+1.596*V;d[o+1]=c-0.392*U-0.813*V;d[o+2]=c+2.017*U;d[o+3]=255}
      ox.putImageData(img,0,0);cx.setTransform(1,0,0,1,0,0);cx.translate(240,320);cx.rotate(cvw.rot*Math.PI/2);if(cvw.mir)cx.scale(-1,1);cx.drawImage(off,-320,-240);$('cami').textContent='480×640'}
    else $('cami').textContent=T('noframe')}
  catch(e){$('cami').textContent=T('camnolink')}
  setTimeout(camTick,250)}
camTick();

// --- 3D (if the CDN is not reachable, the rest still works) ---
try{
  const THREE=await import('three'); const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
  const v=$('v3d'), ren=new THREE.WebGLRenderer({antialias:true}); ren.setPixelRatio(devicePixelRatio); v.appendChild(ren.domElement);
  const sc=new THREE.Scene(); sc.background=new THREE.Color(0x0e0718);
  const cam=new THREE.PerspectiveCamera(40,1,0.01,10); cam.up.set(0,0,1); cam.position.set(0.35,-0.45,0.3);
  const oc=new OrbitControls(cam,ren.domElement); oc.target.set(0,0,0.1);
  sc.add(new THREE.HemisphereLight(0xf1ecfa,0x1c1030,1.1)); const key=new THREE.DirectionalLight(0xffffff,1.4); key.position.set(.5,-.6,.9); sc.add(key);
  const grid=new THREE.GridHelper(0.6,12,0x62a81c,0x2e1a4b); grid.rotation.x=Math.PI/2; sc.add(grid);
  const trunk=new THREE.Group(); sc.add(trunk); trunk.position.set(0,0,0.12); const content=new THREE.Group(); trunk.add(content);
  const mjq=q=>new THREE.Quaternion(q[1],q[2],q[3],q[0]);
  const mj=await (await fetch('model/model.json')).json(), bin=await (await fetch('model/meshes.bin')).arrayBuffer(), geoms={};
  for(const [nm,m] of Object.entries(mj.meshes)){const q=new Int16Array(bin,m.voff,m.nverts*3),pos=new Float32Array(m.nverts*3);
    for(let i=0;i<m.nverts;i++)for(let k=0;k<3;k++){const s=m.bbox_max[k]-m.bbox_min[k]||1;pos[i*3+k]=m.bbox_min[k]+(q[i*3+k]+32768)/65535*s}
    const idx=m.index_bytes===2?new Uint16Array(bin,m.ioff,m.ntris*3):new Uint32Array(bin,m.ioff,m.ntris*3);
    const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.BufferAttribute(pos,3));gg.setIndex(new THREE.BufferAttribute(idx,1));gg.computeVertexNormals();geoms[nm]=gg}
  const objs=[]; const root=mj.bodies.find(b=>b.parent<0); content.position.set(...root.pos).negate();
  mj.bodies.forEach(b=>{const node=new THREE.Group();node.position.set(...b.pos);node.quaternion.copy(mjq(b.quat));let inner=node;
    if(b.joint){const p=new THREE.Group();node.add(p);inner=p;if(b.joint.id!=null){joints[b.joint.id]={p,axis:new THREE.Vector3(...b.joint.axis).normalize()};ranges[b.joint.id]=b.joint.range;names[b.joint.id]=b.joint.name}}
    for(const g of b.geoms){const me=new THREE.Mesh(geoms[g.mesh],new THREE.MeshStandardMaterial({color:new THREE.Color(g.rgba[0],g.rgba[1],g.rgba[2]),roughness:.6,flatShading:true}));
      me.position.set(...g.pos);me.quaternion.copy(mjq(g.quat));inner.add(me)}
    objs.push({inner}); if(b.parent<0)content.add(node);else objs[b.parent].inner.add(node)});
  $('hud').dataset.t='hud'; $('hud').textContent=T('hud');
  window.tiltTrunk=g=>{const n=Math.hypot(...g)||1;trunk.quaternion.setFromUnitVectors(new THREE.Vector3(g[0]/n,g[1]/n,g[2]/n),new THREE.Vector3(0,0,-1))};
  const size=()=>{ren.setSize(v.clientWidth,v.clientHeight);cam.aspect=v.clientWidth/v.clientHeight;cam.updateProjectionMatrix()};
  addEventListener('resize',size); size(); (function loop(){requestAnimationFrame(loop);ren.render(sc,cam)})();
}catch(e){$('hud').removeAttribute('data-t'); $('hud').textContent=T('no3d')+e.message}
</script></body></html>
